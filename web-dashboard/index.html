<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Irrigation Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#F6F5F2] text-[#292524] antialiased min-h-screen flex flex-col selection:bg-[#CCFBF1] selection:text-[#0D9488]">

  <!-- TOP NAVBAR -->
  <header class="bg-white/80 backdrop-blur-md border-b border-[#E7E5E4] sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#059669] to-[#0D9488] flex items-center justify-center text-white shadow-md shadow-[#059669]/20">
          <i data-lucide="leaf" class="w-5 h-5 fill-current"></i>
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight tracking-tight">AgriSmart</h1>
          <p class="text-[10px] uppercase tracking-wider text-[#78716C] font-semibold">Irrigation Control</p>
        </div>
      </div>
      
      <!-- DESKTOP NAV -->
      <nav class="hidden md:flex items-center gap-1 bg-[#F5F5F4] p-1.5 rounded-2xl border border-[#E7E5E4]">
        <button onclick="setTab('overview')" id="nav-desktop-overview" class="px-5 py-1.5 rounded-xl text-xs font-bold transition-all bg-white text-[#059669] shadow-sm">Overview</button>
        <button onclick="setTab('control')" id="nav-desktop-control" class="px-5 py-1.5 rounded-xl text-xs font-bold transition-all text-[#78716C] hover:text-[#292524]">Control</button>
        <button onclick="setTab('more')" id="nav-desktop-more" class="px-5 py-1.5 rounded-xl text-xs font-bold transition-all text-[#78716C] hover:text-[#292524]">More</button>
      </nav>
    </div>
  </header>

  <main class="flex-1 w-full max-w-5xl mx-auto p-4 pb-24 md:pb-8">
    <div id="tab-overview-container"></div>
    <div id="tab-control-container"></div>
    <div id="tab-more-container"></div>
  </main>

  <!-- MOBILE NAV -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-[#E7E5E4] pb-safe z-50 rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.03)]">
    <div class="flex items-center justify-around p-3">
      <button onclick="setTab('overview')" id="nav-mobile-overview" class="flex flex-col items-center gap-1.5 p-1 text-[#059669]">
        <i data-lucide="layout-grid" class="w-5 h-5"></i><span class="text-[10px] font-bold">Overview</span>
      </button>
      <button onclick="setTab('control')" id="nav-mobile-control" class="flex flex-col items-center gap-1.5 p-1 text-[#78716C]">
        <i data-lucide="sliders-horizontal" class="w-5 h-5"></i><span class="text-[10px] font-bold">Control</span>
      </button>
      <button onclick="setTab('more')" id="nav-mobile-more" class="flex flex-col items-center gap-1.5 p-1 text-[#78716C]">
        <i data-lucide="menu" class="w-5 h-5"></i><span class="text-[10px] font-bold">More</span>
      </button>
    </div>
  </nav>

  <script src="js/ui.js"></script>
  <script src="js/mqtt-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
