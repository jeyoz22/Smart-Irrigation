<section id="tab-overview" class="tab-content hidden flex flex-col gap-5">
  
  <div class="bg-[#F5F5F4] border border-[#E7E5E4] rounded-2xl p-4 flex items-center gap-3" id="banner-standby">
    <i data-lucide="loader-2" class="w-5 h-5 text-[#78716C] animate-spin"></i>
    <div>
      <p class="text-sm font-bold text-[#292524]">Sinkronisasi Sensor...</p>
      <p class="text-xs text-[#78716C]">Menunggu data telemetri pertama</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
    <!-- Moisture Card (Teal Theme) -->
    <div class="md:col-span-2 bg-white rounded-[2rem] p-6 md:p-8 shadow-sm border border-[#E7E5E4] relative overflow-hidden">
      <div class="absolute top-0 right-0 w-32 h-32 bg-[#CCFBF1] rounded-bl-full opacity-50 -z-10"></div>
      <div class="flex justify-between items-start z-10">
        <div>
          <span class="text-xs font-bold uppercase tracking-wider text-[#78716C]">Tingkat Kelembaban</span>
          <div class="flex items-baseline gap-2 mt-3">
            <span id="val-moisture" class="text-7xl font-extrabold text-[#0D9488] font-mono tracking-tighter">0</span>
            <span class="text-2xl font-bold text-[#0D9488]/70">%</span>
          </div>
          <p class="text-sm text-[#78716C] mt-2 font-medium">Pembacaan Kapasitif Aktual</p>
        </div>
        <span class="text-xs font-bold px-3 py-1.5 rounded-full bg-[#CCFBF1] text-[#0D9488] border border-[#99F6E4]">Real-time</span>
      </div>
    </div>

    <!-- Threshold Target -->
    <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-[#E7E5E4] flex flex-col items-center justify-center text-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-[#FEF3C7] text-[#D97706] flex items-center justify-center mb-1">
        <i data-lucide="target" class="w-6 h-6"></i>
      </div>
      <div>
        <p class="text-[10px] uppercase font-bold tracking-widest text-[#78716C]">Ambang Batas</p>
        <p id="val-threshold-overview" class="text-3xl font-bold text-[#292524] font-mono mt-1">30%</p>
      </div>
      <p class="text-xs text-[#78716C]">Pemicu otomatis pompa</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
    <div class="bg-white rounded-[1.5rem] p-5 shadow-sm border border-[#E7E5E4]">
      <div class="flex justify-between items-center mb-3">
        <span class="text-xs font-bold tracking-wider text-[#78716C]">ADC RAW</span>
        <i data-lucide="activity" class="w-4 h-4 text-[#0D9488]"></i>
      </div>
      <p class="text-2xl font-bold text-[#292524] font-mono"><span id="val-moisture-raw">0</span></p>
    </div>
    
    <div class="bg-white rounded-[1.5rem] p-5 shadow-sm border border-[#E7E5E4]">
      <div class="flex justify-between items-center mb-3">
        <span class="text-xs font-bold tracking-wider text-[#78716C]">POMPA DC</span>
        <i data-lucide="power" class="w-4 h-4 text-[#059669]"></i>
      </div>
      <div class="flex items-end gap-2">
        <p id="status-pompa-text" class="text-2xl font-bold text-[#A8A29E] font-mono">OFF</p>
        <span id="val-mode-overview" class="text-xs font-bold text-[#78716C] mb-1 uppercase">AUTO</span>
      </div>
    </div>
    
    <div class="bg-white rounded-[1.5rem] p-5 shadow-sm border border-[#E7E5E4]">
      <div class="flex justify-between items-center mb-3">
        <span class="text-xs font-bold tracking-wider text-[#78716C]">RELAI</span>
        <i data-lucide="cpu" class="w-4 h-4 text-[#78716C]"></i>
      </div>
      <span id="status-relai-indikator" class="inline-block px-3 py-1.5 rounded-lg bg-[#F5F5F4] text-[#78716C] text-xs font-bold">Terbuka (NO)</span>
    </div>
  </div>

  <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-[#E7E5E4]">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h3 class="text-base font-bold text-[#292524]">Tren Kelembaban</h3>
        <p class="text-xs text-[#78716C] mt-0.5">Grafik pergerakan kadar air tanah</p>
      </div>
    </div>
    <div id="overviewMoistureApexChart" class="w-full h-64"></div>
  </div>
</section>
